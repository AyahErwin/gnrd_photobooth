<div class="admin-ios-card p-5 sm:p-6">
  <h2
    id="form-title"
    class="text-lg font-semibold mb-4 text-blue-600 flex items-center gap-2"
  >
    <i class="fa-solid fa-plus-circle"></i> Tambah Kios Baru
  </h2>
  <form
    id="form-kiosk"
    class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"
  >
    <input type="hidden" id="kiosk-id" />

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1"
        >Kode Kios</label
      >
      <input
        type="text"
        id="input-kiosk-code"
        placeholder="Contoh: KIOSK-001"
        required
        class="admin-ios-control w-full bg-white border border-gray-300 rounded-xl p-3 text-gray-900 text-sm font-mono focus:outline-none focus:border-blue-500"
      />
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1"
        >Nama Kios / Outlet</label
      >
      <input
        type="text"
        id="input-kiosk-name"
        placeholder="Contoh: Outlet Grand Indonesia"
        required
        class="admin-ios-control w-full bg-white border border-gray-300 rounded-xl p-3 text-gray-900 text-sm focus:outline-none focus:border-blue-500"
      />
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1"
        >Password Operator Kios</label
      >
      <input
        type="password"
        id="input-kiosk-password"
        placeholder="••••••••"
        required
        class="admin-ios-control w-full bg-white border border-gray-300 rounded-xl p-3 text-gray-900 text-sm focus:outline-none focus:border-blue-500"
      />
      <p class="mt-1 text-xs text-gray-500">
        Dipakai Operator untuk login ke layar photobooth kios ini.
      </p>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1"
        >Tipe Paket</label
      >
      <select
        id="input-package-type"
        required
        class="admin-ios-control w-full bg-white border border-gray-300 rounded-xl p-3 text-gray-900 text-sm focus:outline-none focus:border-blue-500"
      >
        <option value="FREE">FREE</option>
        <option value="Berbayar">BERBAYAR</option>
      </select>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1"
        >Lokasi (Opsional)</label
      >
      <input
        type="text"
        id="input-kiosk-location"
        placeholder="Contoh: Tangerang"
        class="admin-ios-control w-full bg-white border border-gray-300 rounded-xl p-3 text-gray-900 text-sm focus:outline-none focus:border-blue-500"
      />
    </div>

    <div class="md:col-span-2 lg:col-span-3 flex justify-end gap-3 pt-2">
      <button
        type="button"
        id="btn-cancel-edit"
        class="hidden px-5 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl text-sm font-semibold transition-all"
      >
        Batal Edit
      </button>
      <button
        type="submit"
        id="btn-save-kiosk"
        class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-semibold shadow-sm transition-all flex items-center gap-2"
      >
        <i class="fa-solid fa-floppy-disk"></i> Simpan Data Kios
      </button>
    </div>
  </form>
</div>
