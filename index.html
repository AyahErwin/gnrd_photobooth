<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GNRD Photobooth Kiosk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth-guard.js"></script>
  </head>
  <body
    class="bg-slate-900 text-white font-sans antialiased select-none min-h-screen overflow-hidden relative"
  >
    <div class="absolute top-6 right-6 z-50 flex items-center gap-3">
      <button
        id="btn-toggle-fullscreen"
        onclick="toggleFullscreen()"
        class="w-12 h-12 bg-white/10 hover:bg-white/20 backdrop-blur-md rounded-full border border-white/20 flex items-center justify-center text-slate-300 hover:text-white transition-all shadow-lg"
        title="Layar Penuh"
      >
        <i id="fullscreen-icon" class="fa-solid fa-expand text-lg"></i>
      </button>

      <button
        id="btn-logout-kiosk"
        onclick="handleLogoutKiosk()"
        class="w-12 h-12 bg-rose-500/20 hover:bg-rose-500/30 backdrop-blur-md rounded-full border border-rose-500/30 flex items-center justify-center text-rose-300 hover:text-white transition-all shadow-lg"
        title="Logout Kios"
      >
        <i class="fa-solid fa-power-off text-lg"></i>
      </button>

    </div>

    <!-- TAHAP 0: STANDBY VIDEO PROMO -->
    <div
      id="step-0"
      class="kiosk-step w-full h-screen relative flex flex-col justify-end items-center overflow-hidden"
    >
      <video
        id="promo-video-player"
        autoplay
        loop
        muted
        playsinline
        webkit-playsinline
        class="absolute inset-0 w-full h-full object-cover z-0"
      >
        <source id="promo-video-source" src="" type="video/mp4" />
      </video>
      <div
        class="absolute inset-0 bg-gradient-to-t from-slate-950/80 via-transparent to-transparent z-10"
      ></div>
      <footer class="relative z-20 pb-12 w-full max-w-xs px-4 text-center">
        <button
          id="btn-start-kiosk"
          onclick="
            if (typeof goToStep === 'function') {
              goToStep(1);
            }
          "
          class="w-full bg-gradient-to-r from-purple-600 via-indigo-600 to-purple-600 hover:scale-105 active:scale-95 text-white font-bold text-lg py-3.5 px-6 rounded-2xl shadow-[0_0_25px_rgba(147,51,234,0.5)] border border-purple-400/40 transition-all flex items-center justify-center gap-3 animate-pulse"
        >
          <i class="fa-solid fa-play text-base"></i> MULAI SESI FOTO
        </button>
      </footer>
    </div>

    <!-- TAHAP 1: PEMBAYARAN QRIS -->
    <div
      id="step-1"
      class="kiosk-step hidden w-full h-screen flex flex-col justify-between items-center p-8 bg-gradient-to-br from-slate-900 via-purple-950 to-slate-900 relative"
    >
      <div
        class="my-auto w-full max-w-4xl flex flex-col items-center justify-center"
      >
        <header class="text-center mb-8">
          <h1
            class="text-4xl md:text-5xl font-black tracking-tight text-white drop-shadow-md"
          >
            Selamat Datang!
          </h1>
          <p class="text-slate-300 text-lg mt-2 font-medium">
            Silakan lakukan pembayaran QRIS untuk memulai sesi foto
          </p>
        </header>

        <main
          class="w-full grid grid-cols-1 md:grid-cols-2 gap-8 items-stretch justify-center"
        >
          <div
            class="bg-white/5 backdrop-blur-xl border border-white/10 rounded-3xl p-8 flex flex-col justify-between shadow-2xl"
          >
            <div>
              <h2 class="text-3xl font-extrabold text-white tracking-tight">
                1 Sesi Photobooth
              </h2>
              <p class="text-slate-400 text-sm mt-3 leading-relaxed">
                Dapatkan 1 lembar photo strip fisik + Link download foto digital
                HD via WhatsApp.
              </p>
            </div>
            <div
              class="mt-8 pt-6 border-t border-white/10 flex justify-between items-end"
            >
              <div>
                <p
                  class="text-[11px] text-slate-400 uppercase tracking-wider font-bold"
                >
                  TOTAL BIAYA
                </p>
                <p
                  id="qris-price-display"
                  class="text-3xl font-black text-emerald-400 mt-1"
                >
                  Rp --
                </p>
              </div>
              <div class="text-right">
                <p
                  class="text-[11px] text-slate-400 uppercase tracking-wider font-bold"
                >
                  SISA WAKTU QR
                </p>
                <p
                  id="qris-timer"
                  class="text-2xl font-mono font-bold text-amber-400 mt-1"
                >
                  --:--
                </p>
              </div>
            </div>
          </div>

          <div
            class="bg-white/5 backdrop-blur-xl border border-white/10 rounded-3xl p-8 flex flex-col items-center justify-between shadow-2xl"
          >
            <div
              class="bg-white p-5 rounded-2xl shadow-xl relative flex flex-col items-center w-64 h-64 justify-center border-4 border-purple-500/20"
            >
              <img
                id="qris-image-display"
                src=""
                alt="QRIS Code"
                class="w-full h-full object-contain rounded-lg"
              />
            </div>
            <button
              id="btn-simulate-pay"
              class="mt-5 w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold py-3.5 px-6 rounded-2xl shadow-lg transition-all flex items-center justify-center gap-2"
            >
              <i class="fa-solid fa-circle-check"></i> Konfirmasi Pembayaran
            </button>
          </div>
        </main>
      </div>
      <footer class="text-center text-xs text-slate-500 pb-2">
        Bantuan Kendala Teknis Hubungi Kasir / Operator Store
      </footer>
    </div>

    <div id="modal-notice-container"></div>

    <script src="js/config.local.js" onerror="this.remove()"></script>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/step1-payment.js"></script>
    <script src="js/step2-frame.js"></script>
    <script>
      async function loadIndexComponents() {
        try {
          const noticeRes = await fetch("components/modal-notice.html");
          document.getElementById("modal-notice-container").innerHTML =
            await noticeRes.text();
        } catch (e) {
          console.error("Gagal load modal:", e);
        }

        const script = document.createElement("script");
        script.src = "js/index.js";
        document.body.appendChild(script);
      }

      document.addEventListener("DOMContentLoaded", loadIndexComponents);
    </script>
  </body>
</html>
