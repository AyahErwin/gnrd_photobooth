<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aktivasi Kiosk — GNRD Photobooth</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="css/admin-ios.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth-guard.js"></script>
  </head>
  <body
    class="admin-ios-page min-h-screen flex items-center justify-center p-4"
  >
    <div
      class="admin-ios-card admin-ios-login-card relative"
    >
      <div class="text-center mb-6">
        <div
          class="admin-ios-login-icon w-16 h-16 rounded-3xl mx-auto flex items-center justify-center text-3xl mb-3"
        >
          <i class="fa-solid fa-store"></i>
        </div>
        <h1 class="text-2xl font-bold">Aktivasi Photobooth</h1>
        <p class="text-sm mt-1">
          Masukkan Kode Kios & Password untuk memulai perangkat
        </p>
      </div>

      <form id="form-kiosk-login" autocomplete="off" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold mb-1"
            >Kode Kios</label
          >
          <input
            type="text"
            id="login-kiosk-code"
            placeholder="Contoh: KIOSK-001"
            required
            maxlength="30"
            class="admin-ios-control w-full border rounded-xl p-3.5 focus:outline-none font-mono text-sm"
          />
        </div>

        <div>
          <label class="block text-sm font-semibold mb-1"
            >Password Kios</label
          >
          <input
            type="password"
            id="login-kiosk-pass"
            placeholder="••••••••"
            required
            maxlength="50"
            class="admin-ios-control w-full border rounded-xl p-3.5 focus:outline-none text-sm"
          />
        </div>

        <button
          type="submit"
          id="btn-login-submit"
          class="admin-ios-login-button w-full py-3.5 font-semibold transition-all text-sm active:scale-[0.98] flex justify-center items-center gap-2 mt-2"
        >
          <i class="fa-solid fa-bolt"></i> Masuk & Aktifkan Layar
        </button>
      </form>

      <a
        href="staff-login.html"
        class="mt-4 block text-center text-sm font-medium text-blue-700"
      >
        Login Owner / Admin
      </a>
    </div>

    <div id="modal-container"></div>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script>
      async function loadLoginComponents() {
        try {
          const response = await fetch("components/modal-notice.html");
          if (!response.ok) {
            throw new Error(
              `Gagal memuat komponen notifikasi (HTTP ${response.status}).`,
            );
          }

          document.getElementById("modal-container").innerHTML =
            await response.text();

          const loginScript = document.createElement("script");
          loginScript.src = "js/login.js";
          loginScript.onerror = () => {
            console.error("Gagal memuat js/login.js.");
            alert("Halaman login gagal dimuat. Silakan muat ulang halaman.");
          };
          document.body.appendChild(loginScript);
        } catch (error) {
          console.error("Gagal memuat komponen login:", error);
          alert(
            "Pop-up login gagal dimuat. Pastikan aplikasi dibuka melalui localhost dan muat ulang halaman.",
          );
        }
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", loadLoginComponents, {
          once: true,
        });
      } else {
        loadLoginComponents();
      }
    </script>
  </body>
</html>
