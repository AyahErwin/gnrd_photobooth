<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Staf — GNRD Photobooth</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="css/admin-ios.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body
    class="admin-ios-page min-h-screen flex items-center justify-center p-4"
  >
    <main class="admin-ios-card admin-ios-login-card">
      <div class="text-center mb-6">
        <div
          class="admin-ios-login-icon w-16 h-16 rounded-3xl mx-auto flex items-center justify-center text-3xl mb-3"
        >
          <i class="fa-solid fa-user-shield"></i>
        </div>
        <h1 class="text-2xl font-bold">Login Admin</h1>
        <p class="text-sm mt-1">Masuk dengan akun staf yang telah dibuat Kantor Pusat.</p>
      </div>

      <form id="form-staff-login" class="space-y-4">
        <div>
          <label for="staff-email" class="block text-sm font-semibold mb-1"
            >Email</label
          >
          <input
            id="staff-email"
            type="email"
            autocomplete="username"
            required
            class="admin-ios-control w-full border rounded-xl p-3.5 text-sm"
          />
        </div>
        <div>
          <label for="staff-password" class="block text-sm font-semibold mb-1"
            >Password</label
          >
          <input
            id="staff-password"
            type="password"
            autocomplete="current-password"
            required
            class="admin-ios-control w-full border rounded-xl p-3.5 text-sm"
          />
        </div>
        <button
          id="btn-staff-login"
          type="submit"
          class="admin-ios-login-button w-full py-3.5 font-semibold"
        >
          Masuk
        </button>
        <p id="staff-login-message" class="hidden rounded-xl p-3 text-sm" role="alert"></p>
      </form>

      <a
        href="login.html"
        class="mt-5 block text-center text-sm font-medium text-blue-700"
      >
        Kembali ke login operator kiosk
      </a>
    </main>

    <script src="js/config.js"></script>
    <script src="js/staff-login.js"></script>
  </body>
</html>
