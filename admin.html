<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard — GNRD Photobooth Kiosk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="css/admin-ios.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body
    class="admin-ios-page hidden min-h-screen p-4 sm:p-6 flex flex-col items-center justify-center relative"
  >
    <div
      id="staff-session-bar"
      class="hidden absolute top-4 right-4 z-10 flex items-center gap-3"
    ></div>
    <div
      class="admin-ios-card max-w-xl w-full p-5 sm:p-8"
    >
      <div class="flex items-center gap-3 mb-6 border-b border-gray-200 pb-4">
        <i class="fa-solid fa-sliders text-blue-600 text-3xl"></i>
        <div>
          <h1 class="text-2xl font-bold text-gray-900">Panel Konfigurasi Kiosk</h1>
          <p class="text-xs text-gray-600">
            Pengaturan Terpusat via Database Supabase
          </p>
        </div>
      </div>

      <a
        data-head-office-only
        href="kiosks.html"
        class="w-full py-3 bg-white border border-blue-200 hover:bg-blue-50 rounded-xl flex items-center justify-center gap-2 text-sm font-semibold text-blue-700 transition-all mb-6"
      >
        <i class="fa-solid fa-store"></i> Kelola Data Kios
      </a>

      <a
        data-head-office-only
        href="staff-users.html"
        class="w-full py-3 bg-white border border-gray-200 hover:bg-gray-50 rounded-xl flex items-center justify-center gap-2 text-sm font-semibold text-gray-700 transition-all mb-6"
      >
        <i class="fa-solid fa-users"></i> Kelola Akun Staf Kios
      </a>

      <div
        class="admin-ios-summary mb-6 p-4 rounded-2xl flex items-center gap-4"
      >
        <img
          id="admin-qris-preview"
          src=""
          alt="QRIS Aktif"
          class="w-20 h-20 object-contain bg-white p-2 rounded-xl"
        />
        <div>
          <p class="text-xs text-gray-600 uppercase font-bold">
            QRIS Aktif Saat Ini
          </p>
          <p
            id="admin-price-preview"
            class="text-lg font-bold text-green-700"
          >
            Rp 0
          </p>
          <p id="admin-time-preview" class="text-xs text-amber-700 font-mono">
            Timer: 0 Detik
          </p>
        </div>
      </div>

      <form id="form-admin-config" class="space-y-4 text-sm">
        <div id="config-target-container" data-head-office-only>
          <label
            class="block font-semibold mb-1 text-gray-700"
            for="config-target-kiosk"
            >Kios yang dikonfigurasi</label
          >
          <select
            id="config-target-kiosk"
            class="admin-ios-control w-full bg-white border border-gray-300 rounded-xl p-3 text-gray-900"
          ></select>
        </div>

        <p
          id="kiosk-admin-config-note"
          class="hidden rounded-xl bg-blue-50 p-3 text-blue-800"
        >
          Anda hanya dapat mengubah harga dan durasi QRIS untuk kios ini.
        </p>

        <div id="global-media-config" data-head-office-only class="space-y-4">
          <div>
            <label class="block font-semibold mb-1 text-gray-700"
              >Upload Video Promo Standby (.mp4)</label
            >
            <input
              type="file"
              id="input-video-file"
              accept="video/mp4,video/*"
              class="admin-ios-control w-full bg-white border border-gray-300 rounded-xl p-3 text-gray-700 text-sm focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
            />
          </div>

          <div>
            <label class="block font-semibold mb-1 text-gray-700"
              >Upload Gambar QRIS Baru</label
            >
            <input
              type="file"
              id="input-qris-file"
              accept="image/*"
              class="admin-ios-control w-full bg-white border border-gray-300 rounded-xl p-3 text-gray-700 text-sm focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
            />
          </div>
        </div>

        <div>
          <label class="block font-semibold mb-1 text-gray-700"
            >Harga Paket Photobooth (Rp)</label
          >
          <input
            type="number"
            id="input-price"
            required
            min="0"
            max="2147483647"
            step="1"
            class="admin-ios-control w-full bg-white border border-gray-300 rounded-xl p-3 text-gray-900 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 font-mono text-base"
          />
        </div>

        <div>
          <label class="block font-semibold mb-1 text-gray-700"
            >Durasi Timer QRIS (Detik)</label
          >
          <input
            type="number"
            id="input-qris-time"
            required
            min="1"
            max="300"
            step="1"
            class="admin-ios-control w-full bg-white border border-gray-300 rounded-xl p-3 text-gray-900 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 font-mono text-base"
          />
        </div>

        <div class="pt-4 flex gap-4">
          <a
            data-head-office-only
            href="index.html"
            class="w-1/2 py-3.5 rounded-xl border border-gray-300 bg-white text-gray-700 text-center font-semibold hover:bg-gray-50 transition-all"
            >Lihat Layar Kiosk</a
          >
          <button
            type="submit"
            id="btn-save"
            class="w-1/2 py-3.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold shadow-sm transition-all flex justify-center items-center gap-2"
          >
            <i class="fa-solid fa-floppy-disk"></i> Simpan Ke Supabase
          </button>
        </div>
      </form>
    </div>

    <!-- Container Komponen Modal Pop-Up Notifikasi Global -->
    <div id="modal-container"></div>

    <!-- Script Utama -->
    <script src="js/config.local.js" onerror="this.remove()"></script>
    <script src="js/config.js"></script>
    <script src="js/admin-auth.js"></script>
    <script src="js/app.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        await window.adminAuthReady;
        if (!window.currentStaffProfile) return;
        try {
          const modalRes = await fetch("components/modal-notice.html");
          if (!modalRes.ok) throw new Error("Komponen modal admin gagal dimuat.");
          document.getElementById("modal-container").innerHTML = await modalRes.text();

          const script = document.createElement("script");
          script.src = "js/admin.js";
          await new Promise((resolve, reject) => {
            script.onload = resolve;
            script.onerror = () => reject(new Error("js/admin.js gagal dimuat."));
            document.body.appendChild(script);
          });
        } catch (e) {
          console.error("Gagal memuat komponen:", e);
        }
      });
    </script>
  </body>
</html>
