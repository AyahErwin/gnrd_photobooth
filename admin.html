<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard — GNRD Photobooth Kiosk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body
    class="bg-slate-900 text-white font-sans min-h-screen p-6 flex flex-col items-center justify-center relative"
  >
    <div
      class="max-w-xl w-full bg-slate-800 border border-white/10 rounded-3xl p-8 shadow-2xl"
    >
      <div class="flex items-center gap-3 mb-6 border-b border-white/10 pb-4">
        <i class="fa-solid fa-sliders text-purple-400 text-3xl"></i>
        <div>
          <h1 class="text-2xl font-black">Panel Konfigurasi Kiosk</h1>
          <p class="text-xs text-slate-400">
            Pengaturan Terpusat via Database Supabase
          </p>
        </div>
      </div>

      <div
        class="mb-6 bg-slate-900/50 p-4 rounded-2xl flex items-center gap-4 border border-white/5"
      >
        <img
          id="admin-qris-preview"
          src=""
          alt="QRIS Aktif"
          class="w-20 h-20 object-contain bg-white p-2 rounded-xl"
        />
        <div>
          <p class="text-xs text-slate-400 uppercase font-bold">
            QRIS Aktif Saat Ini
          </p>
          <p
            id="admin-price-preview"
            class="text-lg font-bold text-emerald-400"
          >
            Rp 0
          </p>
          <p id="admin-time-preview" class="text-xs text-amber-400 font-mono">
            Timer: 0 Detik
          </p>
        </div>
      </div>

      <form id="form-admin-config" class="space-y-4 text-sm">
        <!-- Upload Video Promo Baru -->
        <div>
          <label class="block font-bold mb-1 text-slate-300"
            >Upload Video Promo Standby (.mp4)</label
          >
          <input
            type="file"
            id="input-video-file"
            accept="video/mp4,video/*"
            class="w-full bg-slate-900 border border-white/10 rounded-xl p-3 text-slate-300 text-xs focus:outline-none focus:border-purple-500"
          />
          <p class="text-[11px] text-slate-400 mt-1">
            Video yang akan diputar berulang-ulang saat kiosk dalam kondisi
            idle.
          </p>
        </div>

        <!-- Upload QRIS Baru -->
        <div>
          <label class="block font-bold mb-1 text-slate-300"
            >Upload Gambar QRIS Baru</label
          >
          <input
            type="file"
            id="input-qris-file"
            accept="image/*"
            class="w-full bg-slate-900 border border-white/10 rounded-xl p-3 text-slate-300 text-xs focus:outline-none focus:border-purple-500"
          />
        </div>

        <!-- Ubah Harga -->
        <div>
          <label class="block font-bold mb-1 text-slate-300"
            >Harga Paket Photobooth (Rp)</label
          >
          <input
            type="number"
            id="input-price"
            required
            class="w-full bg-slate-900 border border-white/10 rounded-xl p-3 text-white focus:outline-none focus:border-purple-500 font-mono text-base"
          />
        </div>

        <!-- Ubah Timer -->
        <div>
          <label class="block font-bold mb-1 text-slate-300"
            >Durasi Timer QRIS (Detik)</label
          >
          <input
            type="number"
            id="input-qris-time"
            required
            class="w-full bg-slate-900 border border-white/10 rounded-xl p-3 text-white focus:outline-none focus:border-purple-500 font-mono text-base"
          />
        </div>

        <div class="pt-4 flex gap-4">
          <a
            href="index.html"
            class="w-1/2 py-3.5 rounded-2xl border border-white/10 text-center font-bold hover:bg-white/5 transition-all"
            >Lihat Layar Kiosk</a
          >
          <button
            type="submit"
            id="btn-save"
            class="w-1/2 py-3.5 rounded-2xl bg-purple-600 hover:bg-purple-500 text-white font-bold shadow-lg shadow-purple-600/30 transition-all flex justify-center items-center gap-2"
          >
            <i class="fa-solid fa-floppy-disk"></i>
            Simpan Ke Supabase
          </button>
        </div>
      </form>
    </div>

    <div
      id="global-modal-notice"
      class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4"
    >
      <div
        class="bg-slate-800 border border-white/20 rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl flex flex-col items-center"
      >
        <i
          id="modal-notice-icon"
          class="fa-solid fa-circle-check text-emerald-400 text-5xl mb-3"
        ></i>
        <h3 id="modal-notice-title" class="text-xl font-bold text-white mb-2">
          Notifikasi
        </h3>
        <p id="modal-notice-message" class="text-sm text-slate-300 mb-6">
          Pesan notifikasi di sini...
        </p>

        <button
          id="btn-modal-notice-ok"
          class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-bold py-3 px-6 rounded-2xl shadow-lg active:scale-95 transition-all"
        >
          Lanjutkan
        </button>
      </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/config.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        const config = await getAppConfigFromDB();

        const priceInput = document.getElementById("input-price");
        const timeInput = document.getElementById("input-qris-time");
        const qrisPreview = document.getElementById("admin-qris-preview");
        const pricePreview = document.getElementById("admin-price-preview");
        const timePreview = document.getElementById("admin-time-preview");

        priceInput.value = config.price;
        timeInput.value = config.qrisTime;
        if (config.qrisImage) qrisPreview.src = config.qrisImage;
        pricePreview.textContent = `Rp ${Number(config.price).toLocaleString("id-ID")}`;
        timePreview.textContent = `Timer: ${config.qrisTime} Detik`;

        const form = document.getElementById("form-admin-config");
        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          const btnSave = document.getElementById("btn-save");
          btnSave.disabled = true;
          btnSave.innerHTML =
            '<i class="fa-solid fa-spinner fa-spin"></i> Menyimpan...';

          const qrisFileInput = document.getElementById("input-qris-file");
          const videoFileInput = document.getElementById("input-video-file");

          let newQrisUrl = null;
          let newVideoUrl = null;

          // Jika ada video yang dipilih
          if (videoFileInput.files && videoFileInput.files[0]) {
            newVideoUrl = await uploadVideoToStorage(videoFileInput.files[0]);
            // Jika upload gagal, hentikan proses penyimpanan
            if (!newVideoUrl) {
              btnSave.disabled = false;
              btnSave.innerHTML =
                '<i class="fa-solid fa-floppy-disk"></i> Simpan Ke Supabase';
              return;
            }
          }

          // Jika ada gambar QRIS yang dipilih
          if (qrisFileInput.files && qrisFileInput.files[0]) {
            newQrisUrl = await uploadQrisImageToStorage(qrisFileInput.files[0]);
            if (!newQrisUrl) {
              btnSave.disabled = false;
              btnSave.innerHTML =
                '<i class="fa-solid fa-floppy-disk"></i> Simpan Ke Supabase';
              return;
            }
          }

          const success = await saveAppConfigToDB(
            parseInt(priceInput.value),
            parseInt(timeInput.value),
            newQrisUrl,
            newVideoUrl,
          );

          if (success) {
            window.location.reload();
          } else {
            btnSave.disabled = false;
            btnSave.innerHTML =
              '<i class="fa-solid fa-floppy-disk"></i> Simpan Ke Supabase';
          }
        });
      });
    </script>
  </body>
</html>
